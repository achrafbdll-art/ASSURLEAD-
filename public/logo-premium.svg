<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient: Obsidian with Emerald Core -->
    <radialGradient id="bgGrad" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#0F1B14"/>
      <stop offset="35%" stop-color="#080E0B"/>
      <stop offset="75%" stop-color="#030504"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Border Gradient: Luxury Electric Neon Green -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AFF79"/>
      <stop offset="30%" stop-color="#00FF55"/>
      <stop offset="70%" stop-color="#00DC42"/>
      <stop offset="100%" stop-color="#009A28"/>
    </linearGradient>

    <!-- Trend Line Gradient: Deep Growth to Electric Cyan-Mint -->
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C835"/>
      <stop offset="35%" stop-color="#00FF55"/>
      <stop offset="80%" stop-color="#18FFA0"/>
      <stop offset="100%" stop-color="#70FFCE"/>
    </linearGradient>

    <!-- White Accent Gradient: Pure Diamond White to Mint Ice -->
    <linearGradient id="whiteGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAFFF3"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Ambient Halo for Outer Squircle -->
    <filter id="outerHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00FF55" flood-opacity="0.4"/>
    </filter>

    <!-- White Diamond Flare Filter -->
    <filter id="whiteFlare" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Outer Glow Ring -->
  <rect x="22" y="22" width="468" height="468" rx="116" fill="none" stroke="#00FF55" stroke-width="2" stroke-opacity="0.2" filter="url(#outerHalo)"/>

  <!-- Master Squircle Body with Precision Laser Bevel -->
  <rect x="24" y="24" width="464" height="464" rx="114" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="15" stroke-linejoin="round"/>

  <!-- Internal Luxury Glass Bevel (High-End Tactile Sheen) -->
  <rect x="36" y="36" width="440" height="440" rx="102" fill="none" stroke="#2AFF79" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Subtle Ambient Top-Right Radial Glow (Lighting the target area) -->
  <circle cx="400" cy="150" r="160" fill="#00FF55" opacity="0.06"/>

  <!-- Dynamic Upward Growth Vector (Harmonic Golden Ratio Trajectory) -->
  <path d="M 112 376 L 198 286 L 274 338 L 392 162" 
        fill="none" 
        stroke="url(#trendGrad)" 
        stroke-width="25" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)"/>

  <!-- Top-Right Apex Arrowhead & Target Reticle (Pure Diamond White) -->
  <path d="M 322 136 L 412 136 L 412 226" 
        fill="none" 
        stroke="url(#whiteGrad)" 
        stroke-width="23" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#whiteFlare)"/>

  <!-- Luminous Apex Jewel Node at Corner -->
  <circle cx="412" cy="136" r="13" fill="#FFFFFF" filter="url(#whiteFlare)"/>
  <circle cx="412" cy="136" r="6" fill="#00FF55" opacity="0.6"/>

  <!-- Precision Trajectory Vertices (Double-Ring Micro Nodes) -->
  <!-- Node 0: Base Origin -->
  <circle cx="112" cy="376" r="14" fill="#00FF55" filter="url(#neonGlow)"/>
  <circle cx="112" cy="376" r="6" fill="#FFFFFF" opacity="0.9"/>

  <!-- Node 1: Initial Ascent Peak -->
  <circle cx="198" cy="286" r="13" fill="#00FF55" filter="url(#neonGlow)"/>
  <circle cx="198" cy="286" r="5" fill="#FFFFFF" opacity="0.8"/>

  <!-- Node 2: Strategic Dip / Springboard Point -->
  <circle cx="274" cy="338" r="13" fill="#00FF55" filter="url(#neonGlow)"/>
  <circle cx="274" cy="338" r="5" fill="#FFFFFF" opacity="0.8"/>

  <!-- Directional Velocity Pulse Lines (Subtle Fintech Grid Accent) -->
  <line x1="412" y1="116" x2="412" y2="96" stroke="#00FF55" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="432" y1="136" x2="452" y2="136" stroke="#00FF55" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
</svg>