<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep dark base -->
  <rect width="512" height="512" fill="#020403"/>

  <!-- Green neon ambient glow behind badge -->
  <rect x="44" y="44" width="424" height="424" rx="104" fill="none" stroke="#00FF41" stroke-width="32" opacity="0.55" filter="url(#neonGlow)"/>
  <rect x="48" y="48" width="416" height="416" rx="98" fill="none" stroke="#00FF41" stroke-width="10" opacity="0.85"/>

  <!-- Dark Squircle Badge -->
  <rect x="52" y="52" width="408" height="408" rx="92" fill="#040705" stroke="#08120a" stroke-width="2"/>

  <!-- The Inverted Stylized Neon Green 'A' Glyph -->
  <g fill="#48FF1E" stroke="#48FF1E" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- Left Leg + Apex (continuous stroke forming apex) -->
    <path d="M 126 386 L 198 392 L 254 268 L 292 184 L 274 106 L 238 106 Z"/>
    <!-- Right Leg (cut by seam) -->
    <path d="M 314 392 L 386 386 L 304 200 L 264 282 Z"/>
  </g>
</svg>