<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark glossy background gradient -->
    <radialGradient id="bgGrad" cx="45%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#08120C"/>
      <stop offset="50%" stop-color="#040705"/>
      <stop offset="100%" stop-color="#010201"/>
    </radialGradient>

    <!-- Top Right ambient green lighting -->
    <radialGradient id="topLight" cx="75%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#00FF55" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#00FF55" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer neon border gradient -->
    <linearGradient id="borderNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF55"/>
      <stop offset="40%" stop-color="#00FF66"/>
      <stop offset="70%" stop-color="#00DD44"/>
      <stop offset="100%" stop-color="#00B336"/>
    </linearGradient>

    <!-- Neon Green Laser Beam Fill -->
    <linearGradient id="laserCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E644"/>
      <stop offset="40%" stop-color="#00FF55"/>
      <stop offset="80%" stop-color="#33FF88"/>
      <stop offset="100%" stop-color="#80FFBB"/>
    </linearGradient>

    <!-- White Bracket Gradient -->
    <linearGradient id="whiteCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FFF5"/>
    </linearGradient>

    <!-- Deep Neon Green Bloom Filter -->
    <filter id="laserBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur3"/>
      <feGaussianBlur stdDeviation="11" result="blur2"/>
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- White Sparkle Glow -->
    <filter id="sparkleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Border Glow -->
    <filter id="borderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00FF55" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame with Glow -->
  <rect x="22" y="22" width="468" height="468" rx="114" fill="url(#bgGrad)" stroke="url(#borderNeon)" stroke-width="16" filter="url(#borderGlow)"/>
  
  <!-- Subtle Internal Luxury Bevel -->
  <rect x="33" y="33" width="446" height="446" rx="104" fill="none" stroke="#00FF55" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Top-Right Volumetric Lens Glow -->
  <circle cx="380" cy="150" r="180" fill="url(#topLight)"/>

  <!-- ================= GREEN LASER TRAJECTORY ================= -->
  <!-- Layer 1: Wide Volumetric Glow -->
  <path d="M 108 368 L 194 280 L 268 332 L 372 168" fill="none" stroke="#00FF55" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#laserBloom)"/>
  
  <!-- Layer 2: Core Neon Beam with Arrowhead -->
  <path d="M 108 368 L 194 280 L 268 332 L 366 176" fill="none" stroke="url(#laserCore)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#laserBloom)"/>

  <!-- Integrated Green Arrow Head at end of trajectory -->
  <path d="M 326 172 L 378 158 L 364 210 Z" fill="url(#laserCore)" stroke="url(#laserCore)" stroke-width="6" stroke-linejoin="round" filter="url(#laserBloom)"/>

  <!-- Glowing Nodes on Path -->
  <!-- Node 1: Start -->
  <circle cx="108" cy="368" r="15" fill="#00FF55" filter="url(#laserBloom)"/>
  <circle cx="108" cy="368" r="7" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="108" cy="368" r="3" fill="#00FF55"/>

  <!-- Node 2: First Crest -->
  <circle cx="194" cy="280" r="14" fill="#00FF55" filter="url(#laserBloom)"/>
  <circle cx="194" cy="280" r="6" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="194" cy="280" r="2.5" fill="#00FF55"/>

  <!-- Node 3: Trough -->
  <circle cx="268" cy="332" r="14" fill="#00FF55" filter="url(#laserBloom)"/>
  <circle cx="268" cy="332" r="6" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="268" cy="332" r="2.5" fill="#00FF55"/>

  <!-- ================= WHITE TARGET RETICLE / BRACKET ================= -->
  <!-- Soft White Glow under bracket -->
  <path d="M 306 138 L 396 138 Q 402 138 402 144 L 402 234" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#laserBloom)"/>

  <!-- Sharp Pure White Bracket -->
  <path d="M 306 138 L 396 138 Q 402 138 402 144 L 402 234" fill="none" stroke="url(#whiteCap)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Apex Vertex Joint Core -->
  <circle cx="402" cy="138" r="12" fill="#FFFFFF"/>

  <!-- ================= 4-POINT ANAMORPHIC STAR SPARKLE ================= -->
  <!-- Sparkle Glow Center -->
  <g transform="translate(402, 138)" filter="url(#sparkleGlow)">
    <!-- Star Horizontal Flare -->
    <ellipse cx="0" cy="0" rx="24" ry="2.5" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="36" ry="1" fill="#00FF55" opacity="0.8"/>

    <!-- Star Vertical Flare -->
    <ellipse cx="0" cy="0" rx="2.5" ry="24" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="1" ry="36" fill="#00FF55" opacity="0.8"/>

    <!-- Diagonal Soft Rays -->
    <ellipse cx="0" cy="0" rx="12" ry="1.5" transform="rotate(45)" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="12" ry="1.5" transform="rotate(-45)" fill="#FFFFFF" opacity="0.7"/>

    <!-- Diamond Center -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="2" fill="#E0FFF0"/>
  </g>
</svg>